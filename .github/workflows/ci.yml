name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scripts:
    name: PowerShell tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester (against the in-memory fakes, never against Azure DevOps or Azure)
        shell: pwsh
        run: |
          $result = Invoke-Pester -Path ./tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

  validate-configuration:
    name: Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate environments and system against the schemas and the rules (offline)
        shell: pwsh
        run: ./scripts/Test-Configuration.ps1

      - name: Print the orchestration plans
        shell: pwsh
        run: |
          ./scripts/Get-OrchestrationPlan.ps1 -Action DeployAll -Environment test
          ./scripts/Get-OrchestrationPlan.ps1 -Action Remove -Environment dev

  leak-check:
    name: No internal references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Scan for organisation-specific references
        shell: pwsh
        run: ./tools/Test-NoInternalReferences.ps1
        env:
          # Names that must never be published live in a secret, not in the repository.
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check relative links and anchors
        shell: pwsh
        run: ./tools/Test-DocumentationLinks.ps1
